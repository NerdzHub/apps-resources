<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NerdzHub – App Resources</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #f5f5f7;
      padding: 24px 16px 64px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 48px 0 40px;
    }
    header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    header p {
      font-size: 16px;
      color: #6e6e73;
    }
    .app-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .app-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .doc-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .doc-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      background: #f2f2f7;
      color: #0071e3;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background .15s;
    }
    .doc-link:hover {
      background: #e5e5ea;
    }
    footer {
      text-align: center;
      padding-top: 48px;
      font-size: 13px;
      color: #6e6e73;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NerdzHub App Resources</h1>
      <p>Legal documents for apps published on the App Store.</p>
    </header>

    <div class="app-card">
      <h2>True Manifest</h2>
      <div class="doc-links">
        <a class="doc-link" href="tm_terms.html">📄 Terms of Service</a>
        <a class="doc-link" href="tm_privacy.html">🔒 Privacy Policy</a>
      </div>
    </div>

    <footer>© 2025 NerdzHub. All rights reserved.</footer>
  </div>
</body>
</html>
